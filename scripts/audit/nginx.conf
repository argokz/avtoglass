worker_processes 1;
pid nginx.pid;
error_log nginx-error.log;
events { worker_connections 1024; }
http {
    access_log nginx-access.log;
    include C:/nginx/conf/mime.types;
    default_type application/octet-stream;
    upstream audit_php {
        server 127.0.0.1:9124;
        server 127.0.0.1:9125;
        server 127.0.0.1:9126;
        server 127.0.0.1:9127;
    }
    server {
        listen 127.0.0.1:18016;
        root H:/projects/avtoglasskz/public;
        index index.php;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location ~ \.php$ {
            include C:/nginx/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param APP_ENV preview;
            fastcgi_param APP_CONFIG_CACHE bootstrap/cache/config.preview.php;
            fastcgi_param APP_URL http://127.0.0.1:18016;
            fastcgi_param DB_HOST 127.0.0.1;
            fastcgi_param DB_PORT 5441;
            fastcgi_param DB_DATABASE avtoglasskz_modernization_preview;
            fastcgi_param DB_USERNAME audit;
            fastcgi_param DB_PASSWORD "";
            fastcgi_pass audit_php;
        }
    }
}
