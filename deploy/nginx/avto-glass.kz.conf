# АвтостеклоЦентр — конфигурация nginx.
#
# Установка:
#   cp deploy/nginx/snippets/avtoglass-security-headers.conf /etc/nginx/snippets/
#   cp deploy/nginx/avto-glass.kz.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/avto-glass.kz.conf /etc/nginx/sites-enabled/
#
# Снипет обязателен: без него nginx не стартует, а заголовки безопасности
# лежат именно в нём — в location со своим add_header они иначе не работают.
#
# Перед первым запуском заменить в этом файле:
#   PATH_TO_PROJECT — куда выкачан проект (без /public на конце)
#   PHP_SOCKET      — сокет php-fpm, обычно /run/php/php8.3-fpm.sock
#
# Проверка и перезагрузка:
#   nginx -t && systemctl reload nginx
#
# Директива «http2 on» появилась в nginx 1.25.1. На версиях старше её надо
# убрать, а в listen дописать http2: listen 443 ssl http2;

# ---------------------------------------------------------------------------
# Ограничение частоты запросов
#
# У форм входа и регистрации в приложении стоит throttle:5,1, но отбивать
# перебор дешевле здесь: nginx отказывает до того, как Laravel поднимет
# сессию и сходит в базу. Телефон подбирается перебором заметно легче
# почты — одиннадцать цифр с известным началом.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=avtoglass_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=avtoglass_forms:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=avtoglass_common:10m rate=300r/m;

# Соединения с одного адреса: браузер держит 6–8 параллельно, запас нужен
# на картинки каталога.
limit_conn_zone $binary_remote_addr zone=avtoglass_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name avto-glass.kz www.avto-glass.kz;

    # Единственное, что отдаём по http: проверку Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://avto-glass.kz$request_uri;
    }
}

# www → без www отдельным блоком: редирект в один шаг, а не в два.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.avto-glass.kz;

    ssl_certificate     /etc/letsencrypt/live/avto-glass.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avto-glass.kz/privkey.pem;

    return 301 https://avto-glass.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avto-glass.kz;

    root PATH_TO_PROJECT/public;
    index index.php;

    charset utf-8;

    # -----------------------------------------------------------------------
    # TLS
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/avto-glass.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avto-glass.kz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AvtoglassTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # -----------------------------------------------------------------------
    # Заголовки безопасности. Подробности и причина вынесения — в самом файле.
    # -----------------------------------------------------------------------
    include snippets/avtoglass-security-headers.conf;

    # -----------------------------------------------------------------------
    # Размеры и таймауты
    #
    # Прайс поставщика — xlsx на несколько мегабайт (текущий 370 КБ, но
    # выгрузки растут). Грузится он через панель, то есть через PHP.
    # -----------------------------------------------------------------------
    client_max_body_size 32m;
    client_body_timeout 60s;
    send_timeout 60s;

    limit_conn avtoglass_conn 24;

    # -----------------------------------------------------------------------
    # Сжатие
    #
    # sitemap.xml — полтора мегабайта текстом, на нём gzip особенно заметен.
    # Картинки товаров у нас SVG-чертежи, они тоже текст и сжимаются.
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json application/rss+xml
        image/svg+xml font/woff font/woff2;

    access_log /var/log/nginx/avto-glass.access.log;
    error_log  /var/log/nginx/avto-glass.error.log warn;

    # -----------------------------------------------------------------------
    # Статика
    #
    # Все блоки статики объявлены через ^~ намеренно: без него регулярные
    # location перехватывают их первыми, и заголовки кеша не применяются.
    #
    # Общего правила «по расширению файла» здесь нет специально. Адрес
    # Livewire содержит случайный префикс (livewire-3470facd/livewire.js),
    # который меняется между окружениями, и такое правило поймало бы его,
    # навесив чужой срок кеша на ответ, который отдаёт приложение.
    # -----------------------------------------------------------------------

    # Сборка Vite: в имени файла хеш содержимого, поэтому кешируем навсегда.
    location ^~ /build/ {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Картинки товаров и логотипы марок — симлинк на storage/app/public.
    location ^~ /storage/ {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Ассеты Filament: их публикует artisan filament:assets при деплое.
    location ^~ /css/filament/ {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /js/filament/ {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Service worker полевой панели. Кешировать нельзя: браузер должен
    # заметить новую версию, иначе мастер неделю ходит со старым приложением.
    location = /sw.js {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files $uri =404;
    }

    # Карта сайта пишется в файл по расписанию — отдаём напрямую.
    location = /sitemap.xml {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri /index.php?$query_string;
    }

    location = /robots.txt {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico {
        include snippets/avtoglass-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Ответы платёжных систем
    #
    # Ограничения частоты здесь нет намеренно: это касса подтверждает оплату,
    # и отброшенный запрос означает деньги, списанные у клиента, но не
    # отмеченные в заказе. Подпись проверяет приложение.
    # -----------------------------------------------------------------------
    location ^~ /oplata/ {
        try_files $uri /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # Ограничение частоты по разделам
    # -----------------------------------------------------------------------

    # Вход в панель: сотрудники часто сидят за одним внешним адресом,
    # поэтому запас по burst больше, чем у покупателей.
    location = /admin/login {
        limit_req zone=avtoglass_auth burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location = /naryad/login {
        limit_req zone=avtoglass_auth burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # Вход и регистрация покупателя — главная мишень для перебора паролей.
    location ~ ^/(vhod|registraciya|kabinet/privyazat)$ {
        limit_req zone=avtoglass_auth burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # Оформление заявки, поиск заявки по номеру, запись на замену.
    location ~ ^/(korzina/oformit|status|zapis)$ {
        limit_req zone=avtoglass_forms burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # Приложение
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=avtoglass_common burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:PHP_SOCKET;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;

        # Разбор прайса идёт из панели и на шести тысячах строк занимает
        # минуты. Обычному запросу столько не нужно, но обрыв посреди импорта
        # оставляет стейджинг наполовину заполненным.
        fastcgi_read_timeout 300s;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Прямых обращений к /index.php снаружи не бывает — сюда попадают
        # только внутренние переходы из try_files.
        internal;
    }

    # Любой другой .php выполнять незачем — в public его и нет.
    location ~ \.php$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Что наружу не отдаём
    # -----------------------------------------------------------------------

    # .env, .git, .htaccess и прочее скрытое. Исключение — проверка сертификата.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Файлы проекта, которые не должны попасть в public даже по ошибке.
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|artisan)$ {
        deny all;
        access_log off;
    }

    # Резервные копии, дампы и следы редакторов.
    location ~* \.(bak|old|orig|save|swp|sql|log)$ {
        deny all;
        access_log off;
    }
}
