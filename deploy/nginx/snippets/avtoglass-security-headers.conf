# Заголовки безопасности.
#
# Вынесены в отдельный файл не ради красоты: в nginx add_header не
# наследуется в location, где есть собственный add_header. Стоит поставить
# в блоке статики заголовок кеша — и nosniff оттуда пропадает, причём молча.
# Поэтому этот файл включается и в server, и в каждый location со своими
# заголовками.
#
# Content-Security-Policy здесь намеренно нет: Livewire и Filament выполняют
# inline-скрипты, и строгая политика гасит обе панели целиком. Вводить её
# нужно отдельной задачей, проверяя админку и наряды.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS включать, только когда сайт уверенно работает по https: полгода
# браузер будет отказываться открывать его по http, и откатить нельзя.
add_header Strict-Transport-Security "max-age=15768000" always;
